name: Build and release EssentialsX

on:
  push:
    branches:
      - 2.x
      - dev/*
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and upload
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout Git repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace

      - name: Publish JUnit report
        if: success() || failure()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: '**/build/test-results/test*/TEST-*.xml'

      - name: Verify plugin jars
        shell: bash
        run: |
          shopt -s nullglob
          modules=(EssentialsX EssentialsXAntiBuild EssentialsXChat EssentialsXDiscord EssentialsXDiscordLink EssentialsXGeoIP EssentialsXProtect EssentialsXSpawn EssentialsXXMPP)
          for module in "${modules[@]}"; do
            files=(jars/"$module"-*.jar)
            if (( ${#files[@]} != 1 )); then
              echo "Expected one JAR for $module, found ${#files[@]}" >&2
              exit 1
            fi
          done

      - name: Upload plugin jars
        uses: actions/upload-artifact@v7
        with:
          name: EssentialsX plugin jars
          path: jars/
          if-no-files-found: error

  release:
    name: Publish prerelease
    needs: build
    if: github.ref == 'refs/heads/2.x' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download plugin jars
        uses: actions/download-artifact@v8
        with:
          name: EssentialsX plugin jars
          path: jars

      - name: Package all plugin jars
        shell: bash
        run: |
          shopt -s nullglob
          files=(jars/*.jar)
          if (( ${#files[@]} < 9 )); then
            echo "Expected at least nine plugin JARs, found ${#files[@]}" >&2
            exit 1
          fi
          zip -j jars/EssentialsX-all-jars.zip "${files[@]}"
          (cd jars && sha256sum *.jar EssentialsX-all-jars.zip > SHA256SUMS.txt)

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="build-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:7}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists"
          else
            gh release create "$tag" jars/* \
              --target "$GITHUB_SHA" \
              --title "Build ${GITHUB_RUN_NUMBER} (${GITHUB_SHA:0:7})" \
              --notes "Automated build of the 2.x branch from commit $GITHUB_SHA." \
              --prerelease
          fi
